[project]
name = "docgen"
version = "0.1.0"
description = "Dynamic Excel-to-Word Document Generator: configurable, offline desktop document automation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "DocGen contributors" }]
dependencies = [
    "openpyxl>=3.1.5,<3.2",
    "xlrd>=2.0.1,<3",
    "docxtpl>=0.20.2,<0.21",
    "docxcompose>=2.2.0,<3",
    "python-docx>=1.2.0,<2",
    "Jinja2>=3.1.6,<4",
    "lxml>=5.0",
    "pydantic>=2.11,<3",
    "PyYAML>=6.0.2,<7",
    "platformdirs>=4.3,<5",
    "defusedxml>=0.7.1,<0.8",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<6.13"]

[project.scripts]
docgen = "docgen.cli.main:main"

[project.gui-scripts]
docgen-gui = "docgen.ui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "lxml-stubs",
    "psutil>=6.0",
    "xlwt>=1.3.0",
]
build = ["pyinstaller>=6.11,<7"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docgen"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
ignore = ["RUF001", "RUF002", "RUF003", "N818", "N812", "N802", "PTH105", "SIM105", "SIM102", "SIM101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PTH", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["docgen"]
exclude = ["src/docgen/ui/"]

[[tool.mypy.overrides]]
module = ["docxtpl.*", "docxcompose.*", "xlrd.*", "openpyxl.*", "docx.*", "PySide6.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (benchmarks, large fixtures)",
    "libreoffice: requires LibreOffice (soffice) on PATH",
    "ui: requires PySide6",
]
qt_api = "pyside6"
