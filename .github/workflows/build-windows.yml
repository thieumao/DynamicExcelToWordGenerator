name: Build Windows

on:
  push:
    tags: ["v*"]
    branches: ["main", "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install
        run: uv sync --extra gui --group build --python 3.12
      - name: Test before packaging
        env:
          QT_QPA_PLATFORM: offscreen
          DOCGEN_REQUIRE_OOXML: "1"
        run: uv run pytest -q -m "not libreoffice"
      - name: Icon
        run: uv run python packaging/make_icon.py packaging/docgen.ico
      - name: PyInstaller (onedir)
        run: uv run pyinstaller packaging/docgen.spec --noconfirm --clean
      - name: Third-party notices
        run: uv run python packaging/third_party_notices.py dist/DocGen/THIRD_PARTY_NOTICES.txt
      - name: Smoke test the built executables
        env:
          QT_QPA_PLATFORM: offscreen
          DOCGEN_REQUIRE_OOXML: "1"
        run: uv run python packaging/smoke_test.py dist/DocGen
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/DocGen -DestinationPath DocGen-windows-x64.zip
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (uv run python -c "import docgen; print(docgen.__version__)").Trim()
          try {
            # unofficial Vietnamese texts for the installer screens; English is used without them
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Vietnamese.isl -OutFile packaging/Vietnamese.isl
          } catch { Write-Warning "Vietnamese installer texts not available: $_" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" packaging/installer.iss
          if ($LASTEXITCODE -ne 0 -and (Test-Path packaging/Vietnamese.isl)) {
            Write-Warning "Retrying without the unofficial Vietnamese installer texts"
            Remove-Item packaging/Vietnamese.isl
            & $iscc "/DAppVersion=$version" packaging/installer.iss
          }
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist-installer
      - name: Test the installer (silent install, smoke test, uninstall)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          DOCGEN_REQUIRE_OOXML: "1"
        run: |
          $setup = Get-ChildItem dist-installer/DocGen-Setup-*.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "DocGen installed"
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=`"$target`"" -Wait
          if (!(Test-Path (Join-Path $target "DocGen.exe"))) { throw "DocGen.exe was not installed" }
          uv run python packaging/smoke_test.py "$target"
          if ($LASTEXITCODE -ne 0) { throw "smoke test of the installed app failed" }
          Start-Process (Join-Path $target "unins000.exe") -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $target "DocGen.exe")) { throw "uninstall left DocGen.exe behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: DocGen-windows-x64
          path: DocGen-windows-x64.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: DocGen-Setup-windows-x64
          path: dist-installer/DocGen-Setup-*.exe
          retention-days: 30
